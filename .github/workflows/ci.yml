name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go.sum
      - name: Test JavaScript models
        run: |
          node tests/i18n.test.js
          node tests/lyrics.test.js
      - name: Test and vet helper
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - name: Build static helper
        run: ./scripts/build-helper.sh
