name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go.sum
      - name: Test JavaScript models
        run: |
          node tests/i18n.test.js
          node tests/lyrics.test.js
      - name: Test and vet helper
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - name: Build static helper
        run: ./scripts/build-helper.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Omarchy Musicfox ${TAG#v}"
